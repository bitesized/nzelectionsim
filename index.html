<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Run thousands of Monte Carlo simulations of the 2026 New Zealand general election, built on the latest 1News–Verian polls and the MMP seat allocation rules." />
    <title>NZ Election Simulator 2026</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 26a12 12 0 0 1 24 0' fill='none' stroke='%231d5fb4' stroke-width='5'/%3E%3Cpath d='M16 14a12 12 0 0 1 12 12' fill='none' stroke='%23d0312d' stroke-width='5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <h1>NZ Election Simulator <span class="year">2026</span></h1>
        <p class="tagline">Monte Carlo forecast of the 7 November general election, built on 1News–Verian polling and MMP seat rules.</p>
      </div>
      <div class="header-meta">
        <div class="countdown" id="countdown"></div>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-9.54-4.54A5.4 5.4 0 0 1 13.36 3.1 9 9 0 0 0 12 3z"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="controls" id="controls" aria-label="Simulation settings"></aside>
      <main class="results" id="results" aria-live="polite"></main>
    </div>

    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
